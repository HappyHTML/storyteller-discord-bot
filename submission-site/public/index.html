<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Story</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        form { display: flex; flex-direction: column; gap: 1rem; }
        input, textarea { padding: 0.5rem; font-size: 1rem; }
        textarea { height: 200px; }
        button { padding: 0.75rem; font-size: 1rem; background-color: #5865F2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #4752C4; }
        #message { margin-top: 1rem; padding: 1rem; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Submit Your Story</h1>
    <form id="storyForm">
        <input type="text" id="title" placeholder="Title" required>
        <input type="text" id="author" placeholder="Author" required>
        <textarea id="content" placeholder="Story Content" required></textarea>
        <button type="submit">Submit Story</button>
    </form>
    <div id="message"></div>

    <script>
        document.getElementById('storyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none';

            const data = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                content: document.getElementById('content').value
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                messageDiv.textContent = result.message || result.error;
                messageDiv.style.display = 'block';
                messageDiv.className = response.ok ? 'success' : 'error';

                if (response.ok) {
                    document.getElementById('storyForm').reset();
                }
            } catch (err) {
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.style.display = 'block';
                messageDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
