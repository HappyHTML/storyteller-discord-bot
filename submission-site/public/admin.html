<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Storyteller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5865F2;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='%23ffffff'><path d='M19 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM5 4h14v16H5V4zm2 2h10v2H7V6zm0 4h10v2H7v-2zm0 4h7v2H7v-2z'/></svg>") 16 16, auto;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .theme-selector {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .theme-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .theme-btn:hover {
            transform: scale(1.2);
        }

        .theme-stardust { background: #5865F2; }
        .theme-embers { background: #ff4d4d; }
        .theme-forest { background: #2ecc71; }
        .theme-midnight { background: #9b59b6; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }

        #loginSection, #adminSection {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 12px;
            margin-top: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        #adminSection { display: none; margin-top: 20px; }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 6px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .story-card {
            background: rgba(51, 65, 85, 0.6);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls { margin-top: 15px; display: flex; gap: 10px; }
        .edit-fields { display: none; margin-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px; }
    </style>
</head>
<body>
    <div class="theme-selector">
        <div class="theme-btn theme-stardust" onclick="setTheme('stardust')" title="Stardust"></div>
        <div class="theme-btn theme-embers" onclick="setTheme('embers')" title="Embers"></div>
        <div class="theme-btn theme-forest" onclick="setTheme('forest')" title="Forest"></div>
        <div class="theme-btn theme-midnight" onclick="setTheme('midnight')" title="Midnight"></div>
    </div>
    <canvas id="canvas"></canvas>

    <div class="container">
        <div id="loginSection">
            <h2>Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Enter Admin Password">
            <button onclick="login()">Login</button>
        </div>

        <div id="adminSection">
            <h1>Admin Dashboard</h1>
            <div id="storiesList">Loading tales...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null };

        const themes = {
            stardust: { primary: '#5865F2', bg: '#020617' },
            embers: { primary: '#ff4d4d', bg: '#1a0505' },
            forest: { primary: '#2ecc71', bg: '#051a0e' },
            midnight: { primary: '#9b59b6', bg: '#0f051a' }
        };

        let currentTheme = localStorage.getItem('story-theme') || 'stardust';

        function setTheme(name) {
            currentTheme = name;
            localStorage.setItem('story-theme', name);
            const theme = themes[name];
            document.documentElement.style.setProperty('--primary', theme.primary);
            document.documentElement.style.setProperty('--bg-color', theme.bg);
            init();
        }

        setTheme(currentTheme);

        window.addEventListener('mousemove', e => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;

                const theme = themes[currentTheme];
                const r = parseInt(theme.primary.slice(1, 3), 16);
                const g = parseInt(theme.primary.slice(3, 5), 16);
                const b = parseInt(theme.primary.slice(5, 7), 16);
                this.color = `rgba(${r}, ${g}, ${b}, ${Math.random() * 0.5 + 0.2})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 150) {
                    this.x -= dx / 20;
                    this.y -= dy / 20;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 200; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        init();
        animate();

        let currentPassword = '';

        async function login() {
            const pw = document.getElementById('adminPassword').value;
            const res = await fetch('/api/admin/stories', {
                headers: { 'Authorization': pw }
            });
            if (res.ok) {
                currentPassword = pw;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                loadStories();
            } else {
                alert('Invalid Password');
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function loadStories() {
            const res = await fetch('/api/admin/stories', {
                headers: { 'Authorization': currentPassword }
            });
            const stories = await res.json();
            const list = document.getElementById('storiesList');
            list.innerHTML = stories.map(s => `
                <div class="story-card" id="story-${s.id}">
                    <h3>#${s.id}: ${escapeHtml(s.title)}</h3>
                    <p><strong>Author:</strong> ${escapeHtml(s.author)}</p>
                    <p>${escapeHtml(s.content.substring(0, 100))}...</p>
                    <div class="controls">
                        <button onclick="toggleEdit(${s.id})">Edit</button>
                        <button style="background: #ef4444;" onclick="deleteStory(${s.id})">Delete</button>
                    </div>
                    <div class="edit-fields" id="edit-${s.id}">
                        <input type="text" id="title-${s.id}" value="${escapeHtml(s.title)}">
                        <input type="text" id="author-${s.id}" value="${escapeHtml(s.author)}">
                        <textarea id="content-${s.id}" maxlength="4000">${escapeHtml(s.content)}</textarea>
                        <button onclick="saveEdit(${s.id})">Save Changes</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleEdit(id) {
            const el = document.getElementById(`edit-${id}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        async function saveEdit(id) {
            const data = {
                id: id,
                title: document.getElementById(`title-${id}`).value,
                author: document.getElementById(`author-${id}`).value,
                content: document.getElementById(`content-${id}`).value
            };
            const res = await fetch('/api/admin/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': currentPassword
                },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert('Story updated!');
                loadStories();
            } else {
                alert('Failed to update.');
            }
        }

        async function deleteStory(id) {
            if (!confirm('Are you sure you want to delete this story?')) return;
            const res = await fetch('/api/admin/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': currentPassword
                },
                body: JSON.stringify({ id })
            });
            if (res.ok) {
                alert('Story deleted!');
                loadStories();
            } else {
                alert('Failed to delete.');
            }
        }
    </script>
</body>
</html>
