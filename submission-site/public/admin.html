<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Storyteller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5865F2;
            --bg-color: #020617;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='%23ffffff'><path d='M19 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM5 4h14v16H5V4zm2 2h10v2H7V6zm0 4h10v2H7v-2zm0 4h7v2H7v-2z'/></svg>") 16 16, auto;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .customizer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .selector-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .selector-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .color-btn.active { border-color: white; transform: scale(1.1); }
        .color-btn:hover { transform: scale(1.2); }

        .style-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .style-btn:hover { background: rgba(255,255,255,0.2); }
        .style-btn.active { background: var(--primary); border-color: transparent; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }

        #loginSection, #adminSection {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 12px;
            margin-top: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        #adminSection { display: none; margin-top: 20px; }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 6px;
        }

        input:focus, textarea:focus { outline: none; border-color: var(--primary); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .story-card {
            background: rgba(51, 65, 85, 0.4);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls { margin-top: 15px; display: flex; gap: 10px; }
        .edit-fields { display: none; margin-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px; }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.75rem;
            opacity: 0.5;
            transition: opacity 0.3s;
            z-index: 100;
        }
        .back-link:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Submissions</a>

    <div class="customizer">
        <div class="selector-label">Background Style</div>
        <div class="selector-row" id="style-selector">
            <button class="style-btn" onclick="setStyle('dots')">Dots</button>
            <button class="style-btn" onclick="setStyle('lines')">Lines</button>
            <button class="style-btn" onclick="setStyle('rising')">Rising</button>
            <button class="style-btn" onclick="setStyle('rain')">Rain</button>
            <button class="style-btn" onclick="setStyle('magnetic')">Magnetic</button>
        </div>

        <div class="selector-label">Accent Color</div>
        <div class="selector-row" id="color-selector">
            <div class="color-btn" onclick="setColor('#5865F2')" style="background: #5865F2" title="Discord Blue"></div>
            <div class="color-btn" onclick="setColor('#ff4d4d')" style="background: #ff4d4d" title="Embers Red"></div>
            <div class="color-btn" onclick="setColor('#2ecc71')" style="background: #2ecc71" title="Forest Green"></div>
            <div class="color-btn" onclick="setColor('#9b59b6')" style="background: #9b59b6" title="Midnight Purple"></div>
            <div class="color-btn" onclick="setColor('#e67e22')" style="background: #e67e22" title="Nova Orange"></div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="container">
        <div id="loginSection">
            <h2>Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Enter Admin Password">
            <button onclick="login()">Login</button>
        </div>

        <div id="adminSection">
            <h1>Admin Dashboard</h1>
            <div id="storiesList">Loading tales...</div>
        </div>
    </div>

    <script>
        // 1. Error Handling (Global)
        window.onerror = function(msg, url, line) {
            alert("Frontend Error: " + msg + "\nAt: " + url + ":" + line);
            return false;
        };

        // 2. Constants and State
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const mouse = { x: null, y: null };
        let particles = [];

        let currentStyle = localStorage.getItem('story-bg-style') || 'dots';
        let currentColor = localStorage.getItem('story-accent-color') || '#5865F2';
        let currentPassword = '';

        // 3. Classes
        class Particle {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;

                if (currentStyle === 'rising') {
                    this.speedX = Math.random() * 0.5 - 0.25;
                    this.speedY = -Math.random() * 1 - 0.5;
                } else if (currentStyle === 'rain') {
                    this.speedX = 0;
                    this.speedY = Math.random() * 5 + 2;
                    this.size = Math.random() * 1 + 1;
                } else if (currentStyle === 'magnetic') {
                    this.speedX = Math.random() * 2 - 1;
                    this.speedY = Math.random() * 2 - 1;
                    this.size = Math.random() * 3 + 1;
                } else { // dots or lines
                    this.speedX = Math.random() * 0.8 - 0.4;
                    this.speedY = Math.random() * 0.8 - 0.4;
                }

                this.rgb = this.hexToRgb(currentColor);
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 88, g: 101, b: 242 };
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (currentStyle === 'rain') {
                    if (this.y > canvas.height) { this.y = -10; this.x = Math.random() * canvas.width; }
                } else if (currentStyle === 'rising') {
                    if (this.y < 0) { this.y = canvas.height + 10; this.x = Math.random() * canvas.width; }
                } else {
                    if (this.x > canvas.width) this.x = 0;
                    else if (this.x < 0) this.x = canvas.width;
                    if (this.y > canvas.height) this.y = 0;
                    else if (this.y < 0) this.y = canvas.height;
                }

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 150) {
                    if (currentStyle === 'magnetic') {
                        this.x += dx / 20;
                        this.y += dy / 20;
                    } else {
                        this.x += dx / 60;
                        this.y += dy / 60;
                    }
                }
            }
            draw() {
                ctx.fillStyle = `rgba(${this.rgb.r}, ${this.rgb.g}, ${this.rgb.b}, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 4. Helper Functions
        function init() {
            particles = [];
            const count = (currentStyle === 'rain') ? 100 : (currentStyle === 'lines' ? 80 : 120);
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function setStyle(name) {
            currentStyle = name;
            localStorage.setItem('story-bg-style', name);
            document.querySelectorAll('.style-btn').forEach(b => {
                b.classList.toggle('active', b.textContent.toLowerCase() === name);
            });
            init();
        }

        function setColor(hex) {
            currentColor = hex;
            localStorage.setItem('story-accent-color', hex);
            document.documentElement.style.setProperty('--primary', hex);

            document.querySelectorAll('.color-btn').forEach(b => {
                const btnHex = rgbToHex(b.style.backgroundColor);
                b.classList.toggle('active', btnHex.toLowerCase() === hex.toLowerCase());
            });

            init();
        }

        function rgbToHex(rgb) {
            if (!rgb) return '';
            if (rgb.startsWith('#')) return rgb;
            const match = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
            if (!match) return rgb;
            const r = parseInt(match[1]);
            const g = parseInt(match[2]);
            const b = parseInt(match[3]);
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function drawLines() {
            if (currentStyle !== 'lines') return;
            const rgb = particles[0].rgb;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.2 * (1 - distance / 100)})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            drawLines();
            requestAnimationFrame(animate);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function login() {
            const btn = document.querySelector('#loginSection button');
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            try {
                const pw = document.getElementById('adminPassword').value;
                const res = await fetch('/api/admin/stories', {
                    headers: { 'Authorization': pw }
                });
                if (res.ok) {
                    currentPassword = pw;
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminSection').style.display = 'block';
                    loadStories();
                } else {
                    let msg = 'Invalid Password';
                    try {
                        const errData = await res.json();
                        if (errData.error) msg = errData.error;
                    } catch(e) {}
                    alert(msg + ' (Status: ' + res.status + ')');
                }
            } catch (e) {
                alert('Connection error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        async function loadStories() {
            const list = document.getElementById('storiesList');
            list.innerHTML = 'Loading stories...';
            try {
                const res = await fetch('/api/admin/stories', {
                    headers: { 'Authorization': currentPassword }
                });
                if (!res.ok) throw new Error('Status ' + res.status);
                const stories = await res.json();
                if (stories.length === 0) {
                    list.innerHTML = 'No stories found.';
                    return;
                }
                list.innerHTML = stories.map(s => `
                <div class="story-card" id="story-${s.id}">
                    <h3>#${s.id}: ${escapeHtml(s.title)}</h3>
                    <p><strong>Author:</strong> ${escapeHtml(s.author)}</p>
                    <p>${escapeHtml(s.content.substring(0, 100))}...</p>
                    <div class="controls">
                        <button onclick="toggleEdit(${s.id})">Edit</button>
                        <button style="background: #ef4444;" onclick="deleteStory(${s.id})">Delete</button>
                    </div>
                    <div class="edit-fields" id="edit-${s.id}">
                        <input type="text" id="title-${s.id}" value="${escapeHtml(s.title)}">
                        <input type="text" id="author-${s.id}" value="${escapeHtml(s.author)}">
                        <textarea id="content-${s.id}" maxlength="4000">${escapeHtml(s.content)}</textarea>
                        <button onclick="saveEdit(${s.id})">Save Changes</button>
                    </div>
                </div>
            `).join('');
            } catch (e) {
                list.innerHTML = 'Error loading stories: ' + e.message;
            }
        }

        function toggleEdit(id) {
            const el = document.getElementById(`edit-${id}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        async function saveEdit(id) {
            const data = {
                id: id,
                title: document.getElementById(`title-${id}`).value,
                author: document.getElementById(`author-${id}`).value,
                content: document.getElementById(`content-${id}`).value
            };
            const res = await fetch('/api/admin/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': currentPassword
                },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert('Story updated!');
                loadStories();
            } else {
                alert('Failed to update.');
            }
        }

        async function deleteStory(id) {
            if (!confirm('Are you sure you want to delete this story?')) return;
            const res = await fetch('/api/admin/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': currentPassword
                },
                body: JSON.stringify({ id })
            });
            if (res.ok) {
                alert('Story deleted!');
                loadStories();
            } else {
                alert('Failed to delete.');
            }
        }

        // 5. Setup & Initialization
        window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('resize', resize);

        resize();
        setStyle(currentStyle);
        setColor(currentColor);
        animate();
    </script>
</body>
</html>
